<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f8ff;
padding:20px;
}

.contact-card{
max-width:700px;
margin:auto;
background:#fff;
padding:30px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

h2{
text-align:center;
color:#0d6efd;
margin-bottom:10px;
}

p{
text-align:center;
color:#666;
margin-bottom:25px;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:6px;
font-weight:600;
color:#333;
}

input,
textarea{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
outline:none;
transition:.3s;
}

input:focus,
textarea:focus{
border-color:#0d6efd;
box-shadow:0 0 8px rgba(13,110,253,.2);
}

textarea{
resize:vertical;
min-height:150px;
}

button{
width:100%;
padding:15px;
background:#0d6efd;
color:#fff;
font-size:17px;
border:none;
border-radius:8px;
cursor:pointer;
transition:.3s;
font-weight:bold;
}

button:hover{
background:#0b5ed7;
}

.contact-info{
margin-top:30px;
text-align:center;
color:#555;
line-height:1.8;
}

.contact-info a{
color:#0d6efd;
text-decoration:none;
}

.contact-info a:hover{
text-decoration:underline;
}

@media(max-width:600px){
.contact-card{
padding:20px;
}
}
</style>
</head>

<body>

<div class="contact-card">

<h2>Contact Us</h2>

<p>Have questions, suggestions, or feedback? We'd love to hear from you.</p>

<form action="#" method="post">

<div class="form-group">
<label>Full Name</label>
<input type="text" placeholder="Enter your name" required>
</div>

<div class="form-group">
<label>Email Address</label>
<input type="email" placeholder="Enter your email" required>
</div>

<div class="form-group">
<label>Subject</label>
<input type="text" placeholder="Subject" required>
</div>

<div class="form-group">
<label>Message</label>
<textarea placeholder="Write your message..." required></textarea>
</div>

<button type="submit">Send Message</button>

</form>

<div class="contact-info">

<strong>Email:</strong><br>
<a href="mailto:nobelprize51@gmail.com">nobelprize51@gmail.com</a>

<br><br>

<strong>Website:</strong><br>
<a href="https://3tones.xyz" target="_blank">https://3tones.xyz</a>

</div>

</div>

</body>
</html>
