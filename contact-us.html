<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href=" favicon-16x16.png " type="image/x-icon">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f9ff;
padding:30px;
}

.contact-container{
max-width:650px;
margin:auto;
background:#fff;
padding:30px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.contact-container h2{
text-align:center;
color:#0d6efd;
margin-bottom:10px;
}

.contact-container p{
text-align:center;
color:#666;
margin-bottom:25px;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
color:#333;
}

input,
textarea{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
outline:none;
transition:.3s;
}

input:focus,
textarea:focus{
border-color:#0d6efd;
box-shadow:0 0 5px rgba(13,110,253,.3);
}

textarea{
resize:vertical;
min-height:150px;
}

button{
width:100%;
padding:15px;
background:#0d6efd;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#0b5ed7;
}

@media(max-width:600px){
.contact-container{
padding:20px;
}
}
</style>
</head>

<body>

<div class="contact-container">

<h2>Contact Us</h2>

<p>Have a question or suggestion? We'd love to hear from you.</p>

<form action="https://formsubmit.co/nobelprize51@gmail.com" method="POST">

<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_subject" value="New Contact Message">

<div class="form-group">
<label>Full Name</label>
<input type="text" name="name" required>
</div>

<div class="form-group">
<label>Email Address</label>
<input type="email" name="email" required>
</div>

<div class="form-group">
<label>Subject</label>
<input type="text" name="subject" required>
</div>

<div class="form-group">
<label>Message</label>
<textarea name="message" required></textarea>
</div>

<button type="submit">Send Message</button>

</form>

</div>

</body>
</html>
